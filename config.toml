baseURL = "https://demo.abhirajbibhar.pages.dev/"
defaultContentLanguage = "en"
# languageCode deprecated; use defaultContentLanguage / languages
relativeURLs = false
disablePathToLower = true
ignoreFiles = [
    "/content/templates/*",
    "/content/private/*",
]
summaryLength = 20
paginate = 10
enableGitInfo = true

[[menu.main]]
  name = "Home"
  url = "/"
  identifier = "home"

[[menu.main]]
  name = "Notes"
  url = "/notes"
  identifier = "note"

[services]
  [services.googleAnalytics]
    id = " "

[markup]
    [markup.tableOfContents]
        endLevel = 3
        ordered = true
        startLevel = 2
    [markup.highlight]
        noClasses = false
        anchorLineNos = false
        codeFences = true
        guessSyntax = true
        hl_Lines = ""
        lineAnchors = ""
        lineNoStart = 1
        lineNos = true
        lineNumbersInTable = true
        style = "dracula"
    [frontmatter]
        lastmod = ["lastmod", ":git", "date", "publishDate"]
        publishDate = ["publishDate", "date"]
    [markup.goldmark.renderer]
        unsafe = true
