baseURL = "https://demo.abhirajbibhar.pages.dev/"
defaultContentLanguage = "en"
enableRobotsTXT = true
# languageCode deprecated; use defaultContentLanguage / languages
relativeURLs = false
disablePathToLower = true
ignoreFiles = [
    "/content/templates/*",
    "/content/private/*",
    "/content/notes/*",
]

summaryLength = 35
enableGitInfo = true

[pagination]
  pagerSize = 10

[[menu.main]]
  name = "Home"
  url = "/"
  identifier = "home"

[[menu.main]]
  name = "Writings"
  url = "/posts"
  identifier = "blog"

[[menu.main]]
  name = "About"
  url = "/about"
  identifier = "about"

# [[menu.main]]
#  name = "Notes"
#  url = "/notes"
#  identifier = "note" 

[services]
  [services.googleAnalytics]
    # Blank id = analytics disabled. The previous single-space value made Hugo
    # emit the gtag snippet anyway, loading gtag/js?id=%20 on every page.
    id = ""

[markup]
    [markup.tableOfContents]
        endLevel = 3
        ordered = true
        startLevel = 2
    [markup.highlight]
        noClasses = false
        anchorLineNos = false
        codeFences = true
        guessSyntax = true
        hl_Lines = ""
        lineAnchors = ""
        lineNoStart = 1
        lineNos = true
        lineNumbersInTable = true
        style = "dracula"
    [frontmatter]
        lastmod = ["lastmod", ":git", "date", "publishDate"]
        publishDate = ["publishDate", "date"]
    [markup.goldmark.renderer]
        unsafe = true
