{{- if (and hugo.Data.config.enableToc (ne .Params.enableToc false)) -}}
{{- $headings := .Fragments.Headings -}}
{{- if $headings -}}
{{- $collapsed := not hugo.Data.config.openToc -}}
<div class="toc">
  <button type="button" class="toc-header{{ if $collapsed }} collapsed{{ end }}" aria-expanded="{{ if $collapsed }}false{{ else }}true{{ end }}">
    <h3>{{ i18n "toc" }}</h3>
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fold" aria-hidden="true">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>
  <ul class="toc-content overflow{{ if $collapsed }} collapsed{{ end }}">
    {{- partial "toc-entry.html" (dict "headings" $headings) -}}
  </ul>
</div>
{{- end -}}
{{- end -}}
