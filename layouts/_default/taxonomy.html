{{ define "main" }}
<article class="popover-hint">
  <div class="markdown-preview-view markdown-rendered">
    {{ partial "textprocessing.html" . }}
    <div class="tag-cloud">
      {{ range .Site.Taxonomies.tags.ByCount }}
      <div class="meta">
        <h3><a href="{{ .Page.RelPermalink }}">{{ .Page.Title | humanize }}</a></h3>
        <p>{{ .Count }} {{ i18n "notes_count" }}</p>
      </div>
      {{ end }}
    </div>
  </div>
</article>
{{ end }}
